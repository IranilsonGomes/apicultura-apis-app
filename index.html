<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApisApp Pro - Sistema de Gestão de Apicultura</title>

  <!-- CSS com versão atualizada -->
  <link rel="stylesheet" href="./css/styles.css?v=1.6.0">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#f59e0b">
  <link class="brand-logo-icon" rel="icon" type="image/png" href="./assets/icon.png">

  <!-- Chart.js para Gráficos de Produtividade e Finanças -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((registration) => {
          registration.update();
        });
      });
    }
  </script>
</head>
<body>
  <div id="app-container">
    <header class="navbar">
      <a href="#" class="brand">
        <img src="./assets/icon.png" alt="ApisApp Logo" class="brand-logo-img" style="width:44px; height:44px; border-radius:12px; object-fit:cover; border:2px solid var(--honey-400);">
        <div class="brand-text">
          <h1>ApisApp Pro</h1>
          <span>Gestão Apícola Avançada v1.6.0</span>
        </div>
      </a>

      <nav class="nav-links">
        <ul style="display:flex; list-style:none; padding:0; margin:0; gap:0.5rem; flex-wrap:wrap;">
          <li class="nav-item"><button data-tab="dashboard" class="active">📊 Painel Geral</button></li>
          <li class="nav-item"><button data-tab="apiaries">🏞️ Núcleos & Colmeias</button></li>
          <li class="nav-item"><button data-tab="queens">👑 Rainhas & Zootecnia</button></li>
          <li class="nav-item"><button data-tab="inspections">📋 Inspeções & Sanidade</button></li>
          <li class="nav-item"><button data-tab="harvest">🍯 Colheita & Lotes</button></li>
          <li class="nav-item"><button data-tab="finance">💰 Finanças & Vendas</button></li>
          <li class="nav-item"><button data-tab="manejo">🛠️ Manejo & Tarefas</button></li>
          <li class="nav-item"><button data-tab="hivecard">🐝 Fichas & Ranking</button></li>
          <li class="nav-item"><button data-tab="insumos">📦 Insumos</button></li>
          <li class="nav-item"><button data-tab="planejamento">🎯 Planejamento</button></li>
          <li class="nav-item"><button data-tab="calendar">🌸 Calendário Floral</button></li>
          <li class="nav-item"><button data-tab="analytics">📈 Análises & Gráficos</button></li>
          <li class="nav-item"><button data-tab="guide">📚 Guia Técnico</button></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <button class="btn btn-primary" id="btn-cloud-drive" style="font-size:0.8rem; padding:0.4rem 0.85rem;">☁️ Backup & Drive</button>
        <button class="btn btn-secondary" id="btn-export-json" style="font-size:0.8rem; padding:0.4rem 0.8rem;">💾 JSON</button>
        <label for="file-import-json" class="btn btn-secondary" style="font-size:0.8rem; padding:0.4rem 0.8rem; cursor:pointer;">📂 Importar</label>
        <input type="file" id="file-import-json" accept=".json" style="display:none;">
        <button class="btn btn-danger" id="btn-reset-empty" style="font-size:0.8rem; padding:0.4rem 0.8rem;">🧹 Zerar</button>
      </div>
    </header>

    <main class="main-content" id="main-view"></main>

    <footer style="text-align:center; padding:1.5rem; color:var(--slate-400); font-size:0.8rem; border-top:1px solid var(--glass-border); margin-top:2rem;">
      <p><strong>ApisApp Pro v1.6.0</strong> &copy; 2026 - Desenvolvido por <a href="#" style="color:var(--honey-400); font-weight:bold;">Iranilson Gomes</a>.</p>
    </footer>
  </div>

  <div id="modal-backdrop" class="modal-backdrop"></div>
  <script src="./js/app.js?v=1.6.0"></script>
</body>
</html>
